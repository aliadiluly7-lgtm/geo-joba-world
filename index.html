<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO JOBA WORLD - TIGA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0b1220}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:var(--bg);font:14px system-ui;overflow:hidden}
#map{width:100%;height:100%}
.top{position:absolute;top:0;left:0;right:0;z-index:500;background:linear-gradient(90deg,#312e81,#0e7490);color:#fff;padding:10px 12px;font-weight:700}
.btn{position:absolute;z-index:600;background:#fff;color:#000;border:0;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}
#btnTiga{top:55px;left:10px}
#btnSat{top:55px;left:170px;background:#0b1220;color:#fff;border:1px solid #fff}
#info{position:absolute;bottom:10px;left:10px;right:10px;z-index:600;background:rgba(0,0,0,.75);color:#0f0;padding:6px 10px;border-radius:8px;font:11px monospace}
</style>
</head>
<body>
<div class="top">🌍 GEO JOBA WORLD v28 - TIGA - Google Earth + Қазақстан Тигапункт</div>
<div id="map"></div>
<button class="btn" id="btnTiga" onclick="loadRealTiga()">🔺 Тигапункт жүктеу (Қазақстан)</button>
<button class="btn" id="btnSat" onclick="toggleSat()">🛰️ Google Earth Спутник</button>
<div id="info">Дайын: 10 тигапункт - Спутникке ауыс - Google Earth сияқты</div>
<script>
let map=L.map('map').setView([48,68],5);
let osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
let isSat=false;
function toggleSat(){if(!isSat){map.removeLayer(osm);sat.addTo(map);}else{map.removeLayer(sat);osm.addTo(map);}isSat=!isSat;}
const tigaLayer=L.layerGroup().addTo(map);
const pts=[
{name:"Тигапункт 1-класс - Шымкент Орталық h=512м",lat:42.3417,lng:69.5901,klass:1,h:512},
{name:"Тигапункт 4 мкр",lat:42.325,lng:69.585,klass:2,h:498},
{name:"Түркістан",lat:43.297,lng:68.251,klass:1,h:310},
{name:"Алматы Көктөбе",lat:43.231,lng:76.954,klass:1,h:1100},
{name:"Астана",lat:51.18,lng:71.445,klass:1,h:347},
{name:"Тараз",lat:42.9,lng:71.37,klass:2,h:410},
{name:"Шымкент Север",lat:42.36,lng:69.6,klass:1,h:520},
{name:"Қызылорда",lat:44.85,lng:65.5,klass:1,h:128},
{name:"Ақтау",lat:43.64,lng:51.18,klass:2,h:10},
{name:"Өскемен",lat:49.97,lng:82.61,klass:1,h:280},
];
function addTiga(p){const ic=L.divIcon({html:`<div style="background:${p.klass==1?'#f00':'#ff9800'};color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-weight:800">▲${p.klass}</div>`,iconSize:[28,28]});L.marker([p.lat,p.lng],{icon:ic}).bindPopup(`<b>🔺 ${p.name}</b><br>h=${p.h}м<br>${p.lat.toFixed(5)},${p.lng.toFixed(5)}<br><button onclick="map.setView([${p.lat},${p.lng}],17)">🔍 17</button>`).addTo(tigaLayer);}
pts.forEach(addTiga);
async function loadRealTiga(){
document.getElementById('info').textContent='🇰🇿 OSM тигапункт жүктелуде...';
try{
const q=`[out:json][timeout:25]; area["name"="Қазақстан"]->.kz; (node["man_made"="survey_point"](area.kz);); out 200;`;
const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
const d=await r.json();
d.elements.forEach(el=>{if(el.lat)L.marker([el.lat,el.lon],{icon:L.divIcon({html:'<div style="background:#d32f2f;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center">▲</div>'})}).bindPopup(`OSM Тигапункт<br>${el.lat.toFixed(5)},${el.lon.toFixed(5)}`).addTo(tigaLayer);});
document.getElementById('info').textContent=`✅ ${d.elements.length} OSM тигапункт жүктелді`;
}catch(e){document.getElementById('info').textContent='⚠️ Интернет жоқ - 10 дайын нүкте көрсетілді';}
}
</script>
</body>
</html>
