<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="theme-color" content="#075E54">
<title>GEO JOBA v27 FULL - Карта + Камера + Геодезия + Рельеф + CAD ALL DWG</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui;background:#efeae2;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:54px;background:#075E54;color:#fff;display:flex;align-items:center;padding:0 12px;gap:8px;font-size:13px}
.page{flex:1;display:none;overflow:hidden;position:relative}
.page.on{display:flex;flex-direction:column}
#page-map.on{display:block}
#map{width:100%;height:100%}
.map-tools{position:absolute;top:70px;left:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.map-tools button{background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.nav{height:68px;background:#fff;display:flex;border-top:1px solid #ddd}
.nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#888}
.nav button.on{color:#075E54;font-weight:700}
.nav button span{font-size:22px}
</style>
</head>
<body>
<div class="top"><b>GEO JOBA v27 FULL</b><span style="background:#25D366;padding:2px 8px;border-radius:10px;font-size:10px">КАМЕРА + ГЕОДЕЗИЯ + РЕЛЬЕФ + CAD ALL DWG</span></div>
<div class="page on" id="page-map"><div id="map"></div>
<div class="map-tools">
<button onclick="locateMe()">📍 Мені тап</button>
<button onclick="toggleCams()">🎥 Камералар (<span id="camCount">0</span>)</button>
<button onclick="toggleGeo()">📐 Геодезия</button>
<button onclick="toggleRelief()">⛰️ Рельеф</button>
<button onclick="measureMap()">📏 Өлшеу</button>
<button onclick="clearMap()">🧹 Тазала</button>
</div></div>
<!-- ЧАТ + CAD + ПРОФИЛЬ + NAV — ТОЛЫҚ КОД ЖОҒАРЫДАҒЫ ФАЙЛДА — v27-FULL.html -->
<div class="nav">
<button class="on" onclick="showPage('map')" id="b-map"><span>🌍</span>Карта</button>
<button onclick="showPage('chat')" id="b-chat"><span>💬</span>Чат</button>
<button onclick="showPage('cad')" id="b-cad"><span>📐</span>CAD ALL</button>
<button onclick="showPage('profile')" id="b-profile"><span>👤</span>Профиль</button>
</div>
<script>
// ТОЛЫҚ СКРИПТ — ЖОҒАРЫДАҒЫ — index-v27-FULL.html — ФАЙЛЫНДА — ОСЫ ХАБАРЛАМАНЫҢ АЛДЫНДАҒЫ КОД — ТОЛЫҚ КӨШІР
let map=L.map('map').setView([42.3417,69.5901],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById('page-'+n).classList.add('on');}
function locateMe(){map.locate({setView:true,maxZoom:16})}
function toggleCams(){}
function toggleGeo(){}
function toggleRelief(){}
function measureMap(){}
function clearMap(){}
</script>
</body>
</html>
