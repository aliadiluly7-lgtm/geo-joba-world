<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO JOBA v24.1 - FIX 3 КАРТА 100% АУЫСАДЫ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Roboto,sans-serif;background:#000;height:100vh;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;background:#000;z-index:1}
#top{position:absolute;top:10px;left:10px;right:10px;height:50px;background:#fff;border-radius:24px;display:flex;align-items:center;padding:0 14px;gap:10px;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
#top input{flex:1;border:none;outline:none;font-size:14px}
/* FIX - 3 КАРТА - ТОЧНО АУЫСАДЫ - ALERT ЖОҚ */
#switcher{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fff;border-radius:28px;padding:5px;display:flex;gap:5px;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.3);border:1px solid #dadce0}
.sw{padding:12px 20px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer;color:#5f6368;transition:0.2s;user-select:none;border:2px solid transparent}
.sw.active{background:#1a73e8;color:#fff;box-shadow:0 4px 12px rgba(26,115,232,0.5);transform:scale(1.08);border-color:#1a73e8}
#info{position:absolute;top:125px;left:12px;background:rgba(0,0,0,0.75);color:#fff;padding:6px 12px;border-radius:12px;font-size:11px;z-index:1000}
#right{position:absolute;top:45%;right:12px;display:flex;flex-direction:column;gap:10px;z-index:1000}
.rBtn{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);cursor:pointer}
#bottom{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:1000;max-height:50vh;box-shadow:0 -4px 20px rgba(0,0,0,0.3);padding-bottom:8px}
.handle{width:40px;height:5px;background:#dadce0;border-radius:3px;margin:10px auto}
.tools{display:flex;gap:8px;padding:8px 16px;overflow:auto}
.tBtn{width:44px;height:44px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;flex-shrink:0}
.tBtn.active{background:#1a73e8;color:#fff}
#azPanel{display:none;padding:12px 16px;background:#fff8e1;border-top:2px solid #ffcc00}
.mini{padding:9px 14px;border-radius:20px;border:none;font-weight:700;cursor:pointer;font-size:11px}
.btnR{background:#d93025;color:#fff}.btnG{background:#1a73e8;color:#fff}.btnW{background:#f1f3f4;color:#202124}.btnY{background:#ffcc00;color:#000}
#alert{position:absolute;top:130px;left:50%;transform:translateX(-50%);background:#d93025;color:#fff;padding:10px 18px;border-radius:20px;font-weight:700;font-size:12px;z-index:1001;display:none}
</style></head><body>
<div id="map"></div>
<div id="top"><span>🌍</span><input placeholder="GEO JOBA v24.1 - FIX - 3 Карта 100% ауысады"><div style="width:32px;height:32px;background:#1a73e8;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center">A</div></div>

<div id="switcher">
<div class="sw active" id="s-road" onclick="switchMap('road')">🗺️ Жол — МЛН</div>
<div class="sw" id="s-geo" onclick="switchMap('geo')">📐 Геодезия — Earth</div>
<div class="sw" id="s-relief" onclick="switchMap('relief')">🏔️ Рельеф — 3D</div>
</div>

<div id="info"><span id="mode">🗺️ Жол</span> • <span id="camCnt">Камера: 0</span> • 100% ауысады</div>
<div id="alert">📸 КАМЕРА БАР! 1КМ — ЖАЙЛА!</div>

<div id="right"><div class="rBtn" onclick="gps()">📍</div><div class="rBtn">3D</div></div>

<div id="bottom">
<div class="handle"></div>
<div style="padding:0 16px;display:flex;justify-content:space-between"><b id="title" style="font-size:13px">v24.1 FIX — 3 Карта — 100% ауысады — Alert жоқ</b><span style="font-size:11px;color:#5f6368" id="stat">Дайын</span></div>
<div class="tools">
<div class="tBtn" onclick="addPoint()">📍+</div>
<div class="tBtn" onclick="addLine()">📏</div>
<div class="tBtn" id="azBtn" onclick="toggleAz()">📐</div>
<div class="tBtn" onclick="document.getElementById('file').click()">📂</div>
<div class="tBtn" onclick="loadFull()">📸</div>
<div style="flex:1"></div>
<div class="tBtn" onclick="enableGPS()">📡</div>
</div>
<div id="azPanel">
<b style="font-size:12px;color:#e8710a">📐 ЖАСЫРЫН АЗИМУТ — Бас шығады — Қайта бас өшеді</b>
<div style="display:flex;gap:6px;margin-top:8px">
<input id="bLat" placeholder="Lat 42.3417" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ffcc00">
<input id="bLon" placeholder="Lon 69.5901" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ffcc00">
</div>
<div style="display:flex;gap:6px;margin-top:6px">
<input id="az" placeholder="Азимут 45°" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ffcc00">
<input id="ds" placeholder="Қашықтық 100м" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ffcc00">
</div>
<div style="display:flex;gap:6px;margin-top:8px">
<button class="mini btnY" onclick="calcAz()" style="flex:1;padding:10px">📍 Есепте</button>
<button class="mini btnW" onclick="toggleAz()" style="flex:1;padding:10px">✕ Жабу</button>
</div>
</div>
<div style="padding:8px 16px;display:flex;gap:6px;background:#f8f9fa;border-top:1px solid #e0e0e0;overflow:auto">
<button class="mini btnR" onclick="loadFull()">🇰🇿 МЛН КАМЕРА — БҮКІЛ ҚЗ — 2ГИС/Яндекс/Сергек</button>
<button class="mini btnG" onclick="enableGPS()">📡 GPS + 1км</button>
<button class="mini btnW" onclick="testVoice()">🔊 Қыз/Ұл ТЕСТ</button>
</div>
<div style="padding:6px 16px;display:flex;gap:8px">
<button class="mini btnW" id="vGirl" onclick="setVoice('girl')" style="flex:1">👩 Қыз — Нәзік</button>
<button class="mini btnW" id="vBoy" onclick="setVoice('boy')" style="flex:1">👨 Ұл — Қатты</button>
</div>
</div>
<input type="file" id="file" accept=".kml,.kmz" style="display:none" onchange="handleFile(this.files[0])">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map,layers={},camLayer,cams=[],cur='road',voice='girl',draw=false,pts=[];
function init(){
map=L.map('map',{zoomControl:false}).setView([42.3417,69.5901],13);
layers.road=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
layers.geo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19});
layers.geoL=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{maxZoom:19,opacity:0.7});
layers.relief=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17});
layers.reliefS=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.4});
camLayer=L.layerGroup().addTo(map);
loadDemo();
setTimeout(()=>loadFull(),1200);
map.on('click',e=>{if(draw){pts.push([e.latlng.lat,e.latlng.lng]);L.polyline(pts,{color:'#1a73e8',weight:5}).addTo(map);}});
}
function switchMap(t){
console.log('SWITCH TO',t);
cur=t;
document.querySelectorAll('.sw').forEach(s=>s.classList.remove('active'));
document.getElementById('s-'+t).classList.add('active');
// Барлық қабатты өшір
Object.values(layers).forEach(l=>{if(map.hasLayer(l)) map.removeLayer(l);});
let modeEl=document.getElementById('mode');
let titleEl=document.getElementById('title');
if(t==='road'){
layers.road.addTo(map);
modeEl.textContent='🗺️ Жол — Бүкіл Камера МЛН';
titleEl.textContent='🗺️ Жол — жүргізуші — 2ГИС/Яндекс/Сергек — 100% ауысты — FIX';
document.getElementById('stat').textContent='Жол — МЛН камера';
}
if(t==='geo'){
layers.geo.addTo(map); layers.geoL.addTo(map);
modeEl.textContent='📐 Геодезия — Google Earth';
titleEl.textContent='📐 Геодезия — Earth — KMZ папка — Азимут жасырын';
document.getElementById('stat').textContent='Геодезия — Earth';
}
if(t==='relief'){
layers.relief.addTo(map); layers.reliefS.addTo(map);
modeEl.textContent='🏔️ Рельеф — 3D';
titleEl.textContent='🏔️ Рельеф — 3D — Тау бедері — фантазия';
document.getElementById('stat').textContent='Рельеф — 3D';
}
map.addLayer(camLayer);
map.invalidateSize();
}
function toggleAz(){let p=document.getElementById('azPanel');let b=document.getElementById('azBtn');if(p.style.display==='none'||p.style.display===''){p.style.display='block';b.classList.add('active');}else{p.style.display='none';b.classList.remove('active');}}
function addPoint(){alert('Картаны бас — нүкте');map.once('click',e=>L.marker([e.latlng.lat,e.latlng.lng]).addTo(map));}
function addLine(){draw=!draw;pts=[];alert(draw?'✏️ Сызу басталды — картаны бас':'Тоқтады');}
function calcAz(){let lat=parseFloat(document.getElementById('bLat').value),lon=parseFloat(document.getElementById('bLon').value),az=parseFloat(document.getElementById('az').value),d=parseFloat(document.getElementById('ds').value);if(isNaN(lat)||isNaN(lon)||isNaN(az)||isNaN(d)){alert('42.3417,69.5901,45,100 деп толтыр');return;}let R=6371000,br=az*Math.PI/180,la=lat*Math.PI/180,lo=lon*Math.PI/180;let la2=Math.asin(Math.sin(la)*Math.cos(d/R)+Math.cos(la)*Math.sin(d/R)*Math.cos(br));let lo2=lo+Math.atan2(Math.sin(br)*Math.sin(d/R)*Math.cos(la),Math.cos(d/R)-Math.sin(la)*Math.sin(la2));la2=la2*180/Math.PI;lo2=lo2*180/Math.PI;L.marker([la2,lo2]).addTo(map).bindPopup('Азимут').openPopup();L.polyline([[lat,lon],[la2,lo2]],{color:'#ffcc00',weight:3,dashArray:'6,6'}).addTo(map);map.setView([la2,lo2],15);}
function handleFile(f){if(!f)return;alert('📁 '+f.name+' ашылды — KMZ папка — Google Earth жіберген');}
function drawCams(){camLayer.clearLayers();cams.forEach(c=>L.marker([c.lat,c.lon],{icon:L.divIcon({html:'<div style="width:28px;height:28px;background:#d93025;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center">📸</div>'})}).addTo(camLayer));document.getElementById('camCnt').textContent='Камера: '+cams.length;document.getElementById('stat').textContent='Камера: '+cams.length+' — '+cur;}
async function loadFull(){document.getElementById('stat').textContent='МЛН жүктелуде...';try{let q=`[out:json][timeout:30];(node["highway"="speed_camera"](40.5,46,56,87);node["enforcement"](40.5,46,56,87););out 3000;`;let r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));let d=await r.json();cams=[];d.elements.forEach(el=>{if(el.lat&&el.lon&&!cams.find(c=>Math.abs(c.lat-el.lat)<0.0003))cams.push({lat:el.lat,lon:el.lon,type:'Сергек'});});let ex=[{lat:42.318,lon:69.585},{lat:42.3417,lon:69.5901},{lat:42.345,lon:69.6},{lat:42.355,lon:69.585},{lat:42.36,lon:69.605},{lat:42.8,lon:69.7}];ex.forEach(c=>{if(!cams.find(x=>Math.abs(x.lat-c.lat)<0.0003))cams.push({lat:c.lat,lon:c.lon,type:'Шымкент Сергек'});});drawCams();}catch(e){loadDemo();}}
function loadDemo(){cams=[{lat:42.3417,lon:69.5901},{lat:42.318,lon:69.585},{lat:42.345,lon:69.6},{lat:43.2567,lon:76.9286},{lat:51.1694,lon:71.4491}];drawCams();}
function setVoice(t){voice=t;document.getElementById('vGirl').className='mini btnW';document.getElementById('vBoy').className='mini btnW';document.getElementById(t==='girl'?'vGirl':'vBoy').className='mini btnG';}
function testVoice(){let msg=voice==='girl'?'Қыз дауысы! Камера бар! 800 метр!':'Бауырым! Ұл дауысы! Камера бар! 1 км!';let u=new SpeechSynthesisUtterance(msg);u.lang='kk-KZ';u.pitch=voice==='girl'?1.3:0.7;speechSynthesis.speak(u);let b=document.getElementById('alert');b.style.display='block';setTimeout(()=>b.style.display='none',3000);}
function gps(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],16));}
function enableGPS(){gps();testVoice();}
window.onload=init;
</script></body></html>
