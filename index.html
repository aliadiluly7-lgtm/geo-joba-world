<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEO JOBA v14 FIXED - Карта істейді</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#0f0f0f;color:#fff;height:100vh;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
#top{height:48px;background:#1e1e1e;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:2px solid #00ff88;flex-shrink:0}
#main{flex:1;display:flex;overflow:hidden;position:relative}
#map{flex:1;background:#222;height:100% !important;min-height:300px}
#panel{width:320px;background:#1e1e1e;border-left:1px solid #333;display:flex;flex-direction:column;overflow:auto}
.btn{padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:12px;width:100%;margin-bottom:6px;text-align:left}
.btnG{background:#00ff88;color:#000}.btnW{background:#2a2a2a;color:#fff;border:1px solid #444}
.sec{padding:10px;border-bottom:1px solid #333}
.row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0}
</style></head><body>
<div id="app">
<div id="top"><b>GEO JOBA v14 FIXED 🔧</b><span style="color:#00ff88;font-size:11px">— Карта істейді — Алла бұйыртса</span><div style="margin-left:auto"><span style="background:#ff1a1a;padding:5px 8px;border-radius:8px;font-size:10px">💳 87066604117</span></div></div>
<div id="main">
<div id="map"></div>
<div id="panel">
<div class="sec"><b style="color:#00ff88;font-size:11px">📍 GPS — TRIMBLE — ТЕЛЕФОНМЕН СЪЕМКА</b>
<button class="btn btnG" onclick="startGPS()">📡 GPS ҚОСУ — МЕНІ ТАП</button>
<div style="background:#0a0a0a;padding:8px;border-radius:8px;margin-top:6px;font-size:11px">
<div class="row"><span>X (Lng):</span><span id="gx" style="color:#00ff88">—</span></div>
<div class="row"><span>Y (Lat):</span><span id="gy" style="color:#00ff88">—</span></div>
<div class="row"><span>H:</span><span id="gh" style="color:#ffff00">—</span></div>
<div class="row"><span>Точность:</span><span id="gacc">—</span></div>
</div>
<button class="btn btnW" onclick="savePt()">📍 НҮКТЕ АЛУ — СОХРАНИТЬ</button>
<button class="btn btnW" onclick="exportTXT()">⬇️ EXPORT TXT — CIVIL-ҒА</button>
</div>
<div class="sec"><b style="color:#ff8800;font-size:11px">⛰️ ДО-ПОСЛЕ — ГРУНТ — CIVIL</b>
<button class="btn btnW" onclick="calcDoPosle()">⛰️ ДО-ПОСЛЕ — ОБЪЕМ м3 — ЕСЕПТЕУ</button>
<div style="background:#0a0a0a;padding:8px;border-radius:8px;margin-top:6px;font-size:11px">
<div class="row"><span>Нүкте:</span><span id="pcnt" style="color:#00ff88">0</span></div>
<div class="row"><span>Аудан:</span><span id="pArea">— га</span></div>
<div class="row"><span>Объем:</span><span id="pVol" style="color:#ff8800">— м3</span></div>
</div>
<button class="btn btnW" onclick="document.getElementById('f').click()">📂 TXT/DXF АШУ — КООРДИНАТА</button>
<input type="file" id="f" style="display:none" accept=".txt,.csv,.dxf" onchange="openF(this.files[0])">
<div id="log" style="font-size:10px;color:#888;margin-top:6px">> v14 FIXED дайын<br>> Карта — OSM — істейді<br>></div>
</div>
<div class="sec"><b style="font-size:11px">🃏 ДУРАК 54 — 6 АДАМ — ЭКШН</b>
<button class="btn btnW" onclick="alert('Дурак 54 — 6 адам — v12 код — осы сілтемеде: /durak.html')">🎮 ДУРАК ОЙНАУ — 54 КАРТА</button>
</div>
</div>
</div>
</div>
<script>
let map=null, points=[], lastPos=null, gpsWatch=null;
function init(){
console.log('init map');
let mapDiv=document.getElementById('map');
if(!mapDiv){alert('map div жоқ!'); return;}
map=L.map('map',{zoomControl:true}).setView([42.3417,69.5901],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'OSM — істейді!'}).addTo(map);
L.marker([42.3417,69.5901]).addTo(map).bindPopup('Шымкент — GEO JOBA v14 — карта істейді!').openPopup();
map.on('click',e=>{addPt(e.latlng.lng,e.latlng.lat,0,'Картадан');});
setTimeout(()=>{map.invalidateSize(); console.log('invalidate');},500);
document.getElementById('log').innerHTML+='> Карта ашылды — OSM<br>';
}
function addPt(x,y,z,c){points.push({x:x,y:y,z:z,c:c,id:points.length+1}); document.getElementById('pcnt').textContent=points.length; if(map){L.circleMarker([y,x],{radius:7,color:'#00ff88'}).addTo(map).bindPopup(`${points.length}: ${x.toFixed(4)},${y.toFixed(4)}`);} document.getElementById('log').innerHTML+='> Нүкте '+points.length+'<br>';}
function startGPS(){if(!navigator.geolocation){alert('GPS жоқ'); return;} document.getElementById('log').innerHTML+='> GPS іздеу...<br>'; navigator.geolocation.getCurrentPosition(p=>{let lat=p.coords.latitude,lng=p.coords.longitude,acc=p.coords.accuracy,alt=p.coords.altitude||0; lastPos={x:lng,y:lat,z:alt}; document.getElementById('gx').textContent=lng.toFixed(6); document.getElementById('gy').textContent=lat.toFixed(6); document.getElementById('gh').textContent=alt.toFixed(1)+'м'; document.getElementById('gacc').textContent=acc.toFixed(1)+'м'; if(map){map.setView([lat,lng],17); L.marker([lat,lng],{icon:L.divIcon({html:'<div style=width:14px;height:14px;background:#00ff88;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #00ff88></div>'})}).addTo(map);} document.getElementById('log').innerHTML+='> GPS FIX '+acc.toFixed(1)+'м<br>';},err=>{alert('GPS қате: '+err.message); document.getElementById('log').innerHTML+='> GPS қате: '+err.message+'<br>';},{enableHighAccuracy:true,timeout:10000});}
function savePt(){if(!lastPos){alert('Алдымен GPS ҚОСУ бас!'); return;} addPt(lastPos.x,lastPos.y,lastPos.z,'GPS');}
function exportTXT(){if(points.length==0){alert('Нүкте жоқ'); return;} let txt=points.map(p=>`${p.id},${p.x.toFixed(3)},${p.y.toFixed(3)},${p.z.toFixed(3)},${p.c}`).join('\n'); let blob=new Blob([txt],{type:'text/plain'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`sjemka_${points.length}nuqte_${new Date().toISOString().slice(0,10)}.txt`; a.click(); alert(points.length+' нүкте TXT дайын!');}
function openF(f){if(!f)return; let rd=new FileReader(); rd.onload=e=>{let lines=e.target.result.split('\n'); lines.forEach(line=>{let p=line.trim().split(/[\s,;]+/); if(p.length>=2){let x=parseFloat(p[0]),y=parseFloat(p[1]),z=p[2]?parseFloat(p[2]):0; if(!isNaN(x)&&!isNaN(y)){if(x>20&&x<80&&y>20&&y<80){addPt(y,x,z,'TXT');} else {addPt(x,y,z,'TXT');}}}});}; rd.readAsText(f);}
function calcDoPosle(){let area=prompt('Аудан га:','1.24'); let h1=prompt('До H:','100.00'); let h2=prompt('После H:','101.50'); if(!area||!h1||!h2)return; let vol=parseFloat(area)*10000*(parseFloat(h2)-parseFloat(h1)); document.getElementById('pArea').textContent=area+' га'; document.getElementById('pVol').textContent=vol.toFixed(1)+' м3'; alert(`⛰️ ДО-ПОСЛЕ:\nАудан: ${area} га\nДо: ${h1}м\nПосле: ${h2}м\nОбъем: ${vol.toFixed(1)} м3\n${vol>0?'Насыпь':'Выемка'}`);}
window.onload=init;
setTimeout(init,1000);
</script></body></html>
